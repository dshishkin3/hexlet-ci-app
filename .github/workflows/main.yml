name: test

on:
  - push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v6
     - uses: actions/setup-node@v7
       with: 
          node-version: '22'
     - uses: pnpm/action-setup@v6
       with:
          version: '10'

     - run: make setup
     - run: make lint
     - run: make test